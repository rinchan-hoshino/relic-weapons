plugins {
    id 'java-library'
    id 'maven-publish'
    id 'fabric-loom'
}

def root = rootProject

base {
    archivesName = "${root.mod_id}-fabric"
}

sourceSets.main.java.srcDir root.file('common/src/main/java')
sourceSets.main.resources.srcDir root.file('common/src/main/resources')
sourceSets.test.java.srcDir root.file('common/src/test/java')
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

loom {
    mixin {
        defaultRefmapName.set("${root.mod_id}.refmap.json")
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${root.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${root.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${root.fabric_api_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

def resourceProperties = [
    mod_id: root.mod_id,
    mod_name: root.mod_name,
    mod_version: root.mod_version,
    mod_license: root.mod_license,
    mod_authors: root.mod_authors,
    mod_description: root.mod_description,
    minecraft_version: root.minecraft_version,
    fabric_loader_version: root.fabric_loader_version
]

processResources {
    inputs.properties(resourceProperties)
    filesMatching('fabric.mod.json') {
        expand resourceProperties
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${root.mod_id}-fabric"
            from components.java
        }
    }
}
